Name: Athenaeum
Summary: Offline occult companion — tarot, astrology, spirits, and magic
Description: |-
    An occult companion app. Fully offline and local: all data lives in a SQLite
    database on your device, owned entirely by a Rust core. No analytics, no
    tracking, no network calls.

    * Browse the complete 78-card Rider-Waite-Smith tarot deck with upright and
      reversed meanings, keywords, and contextual meanings by situation
    * Daily astrology: planetary day, sun and moon signs, moon illumination, and
      the next sign ingress
    * Moon phase home screen widget and a lunar calendar
    * Natal charts: enter a birth profile and get placements, retrogrades,
      houses, and aspects
    * A bestiary of 39 entities and 205 deities with offerings, searchable, with
      Wikipedia links
    * A grimoire of 32 spells, 26 Icelandic magical staves, and the Elder
      Futhark runes with bindrune uses
    * Everything is editable: rename entries, rewrite meanings, add your own, or
      delete builtins and restore them later
    * Per-feature toggles so you can hide what you don't use
    * Full backup and restore as a single file
    * Wine-and-ink theme, with optional Material You wallpaper colors
    * The Rust core builds from source for all four Android ABIs; no
      prebuilt binaries or network code

